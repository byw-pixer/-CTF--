<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CYBERARENA</title><style>body{font:16px system-ui;background:#101927;color:#ecf2f7;max-width:960px;margin:auto;padding:20px}a{color:#a7e45b}nav{display:flex;gap:16px;flex-wrap:wrap}section,article{background:#1d2b3c;padding:18px;margin:15px 0;border-radius:12px}input,textarea,select,button{padding:9px;margin:4px;max-width:100%;box-sizing:border-box}button{cursor:pointer;background:#a7e45b;border:0;border-radius:6px}label{display:block}small{opacity:.8}.notice{background:#31482b;padding:10px;border-radius:6px}</style></head><body><h1>CYBERARENA</h1><nav><a href="/">Главная</a><a href="/challenges">Задания</a><a href="/leaderboard">Рейтинг</a>{% if user %}<a href="/profile">Профиль</a>{% if user.is_admin %}<a href="/admin">Админка</a>{% endif %}<form action="/logout" method="post"><input type="hidden" name="csrf_token" value="{{csrf}}"><button>Выйти ({{user.username}})</button></form>{% else %}<a href="/login">Войти</a><a href="/register">Регистрация</a>{% endif %}</nav><main>{% block content %}{% endblock %}</main></body></html>
