{% extends 'base.html' %}{% block content %}<article><h2>{{challenge.title}}</h2><p>{{challenge.category}} · {{challenge.difficulty}} · {{challenge.points}} баллов</p><p style="white-space:pre-wrap">{{challenge.description}}</p>{% if challenge.resource_url %}<a href="{{challenge.resource_url}}">Открыть ресурс</a>{% endif %}<form method="post" action="/challenges/{{challenge.id}}/submit"><input type="hidden" name="csrf_token" value="{{csrf}}"><label>Флаг <input name="flag" placeholder="CTF{...}" required maxlength="165"></label><button>Проверить</button></form>{% if message %}<p class="notice">{{message}}</p>{% endif %}</article>{% endblock %}
